# Copy the CONTENTS of this directory to printer_data/config/toolchanger/.
# See docs/toolchanger.md. These are editable user files, not live includes.
# Choose exactly ONE mechanical preset. Any printer size can use calibrated docks.
[include ../config/hardware/toolchanger/stealthchanger.cfg]
# [include ../config/hardware/toolchanger/tapchanger.cfg]

[toolchanger]
# REQUIRED: replace with measured safe physical Y, clear of every dock/tool.
params_safe_y: 120
# Set True only after calibrating park coordinates and validating the path for
# every tool. The example tool files deliberately contain zero dock coordinates.
params_docks_calibrated: False
