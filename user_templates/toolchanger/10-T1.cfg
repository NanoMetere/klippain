# EBB36/42 v1.2 example: adapt MCU identity, wiring, thermistor, motor and PID
# to your hardware. Only files loaded by the selected tools_N.cfg are active.
[mcu tool1]
serial: /dev/serial/by-id/REPLACE_WITH_TOOL_1
# For CAN, replace serial with canbus_uuid, never both.

# Alias names are scoped to an MCU. Identical boards can reuse the SAME aliases
# when each [board_pins] has a distinct section name and mcu assignment.
[board_pins ebb_t1]
mcu: tool1
aliases:
    E_STEP=PD0, E_DIR=PD1, E_ENABLE=PD2, E_UART=PA15,
    E_HEATER=PB13, E_THERMISTOR=PA3,
    PART_FAN=PA0, HOTEND_FAN=PA1, TAP_INPUT=PB6, RUNOUT=PB5, LED_DATA=PD3

[extruder1]
step_pin: tool1:E_STEP
dir_pin: tool1:E_DIR
enable_pin: !tool1:E_ENABLE
microsteps: 32
rotation_distance: 4.637
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_only_distance: 110
max_extrude_cross_section: 5
heater_pin: tool1:E_HEATER
sensor_pin: tool1:E_THERMISTOR
sensor_type: ATC Semitec 104GT-2
min_temp: 0
max_temp: 300
min_extrude_temp: 170
# Start with watermark; run PID_CALIBRATE for this heater and SAVE_CONFIG.
control: watermark
pressure_advance: 0

[tmc2209 extruder1]
uart_pin: tool1:E_UART
run_current: 0.65

[fan_generic T1_partfan]
pin: tool1:PART_FAN

[heater_fan T1_hotend_fan]
pin: tool1:HOTEND_FAN
heater: extruder1
heater_temp: 50

[tool T1]
tool_number: 1
extruder: extruder1
fan: T1_partfan
# Current backend: triggered means ABSENT. Verify polarity on every tool.
detection_pin: !tool1:TAP_INPUT
tool_probe: tool_probe T1
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# REQUIRED: measure these for EACH dock; zeros below are placeholders.
params_park_x: 0
params_park_y: 0
params_park_z: 0
params_pressure_advance: 0
params_pressure_advance_smooth_time: 0.04
params_input_shaper_freq_x: 0
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_y: 0
params_input_shaper_type_y: 'mzv'
params_filament_sensors: ['T1_runout']
params_led_name: 'T1_leds'
params_led_effect_prefix: 'tc_t1'
params_led_logo_idx: '1'
params_led_nozzle_idx: '2,3'

# The backend routes all probes, but Klippain restricts probing to T0 except the
# optional initial home_with_any_tool bootstrap. Do not add a separate [probe].
[tool_probe T1]
pin: !tool1:TAP_INPUT
z_offset: 0
speed: 5
samples: 3
samples_result: median
sample_retract_dist: 2
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _KLIPPAIN_ASSERT_PROBE_TOOL

[filament_switch_sensor T1_runout]
switch_pin: ^tool1:RUNOUT
pause_on_runout: True

[include ../config/hardware/lights/toolchanger/T1.cfg]

[neopixel T1_leds]
pin: tool1:LED_DATA
chain_count: 3
color_order: GRBW
