# Shared fixed-dock motion. Mechanical presets supply paths; the user's tool
# files supply measured park coordinates and clearance planes. No printer size
# or tool count is embedded in these moves. Speeds here are in mm/min.
[toolchanger]
initialize_on: manual
initialize_gcode:
uses_axis: xyz
on_axis_not_homed: abort
require_tool_present: True
verify_tool_pickup: True
abort_on_tool_missing: True
t_command_restore_axis: XYZ
params_docks_calibrated: False
params_fast_speed: 12000
params_path_speed: 900
before_change_gcode:
    _KLIPPAIN_TOOLCHANGE_BEFORE FROM={toolchanger.tool_number} TO={printer[pickup_tool].tool_number if pickup_tool else -1}
after_change_gcode:
    _KLIPPAIN_TOOLCHANGE_AFTER
error_gcode:
    _KLIPPAIN_TOOLCHANGE_ERROR TARGET={printer[pickup_tool].tool_number if pickup_tool is defined and pickup_tool else toolchanger.tool_number} CHANGING={1 if pickup_tool is defined else 0}
dropoff_gcode:
    {% set x, y, z = tool.params_park_x|float, tool.params_park_y|float, tool.params_park_z|float %}
    {% set path = tool.params_dropoff_path %}
    G90
    G0 Z{[printer.toolhead.position.z + 1, printer.toolhead.axis_maximum.z]|min} F{tool.params_fast_speed}
    G0 Y{tool.params_safe_y} F{tool.params_fast_speed}
    G0 X{x} F{tool.params_fast_speed}
    G0 Z{z + path[0].get('z', 0)} F{tool.params_fast_speed}
    G0 Y{y + path[0].get('y', 0)} F{tool.params_fast_speed}
    {% for step in path %}
        G0 {% if 'x' in step %}X{x + step.x}{% endif %} {% if 'y' in step %}Y{y + step.y}{% endif %} {% if 'z' in step %}Z{z + step.z}{% endif %} F{tool.params_path_speed * step.get('f', 1)}
    {% endfor %}
    G0 Y{tool.params_safe_y} F{tool.params_fast_speed}
pickup_gcode:
    {% set x, y, z = tool.params_park_x|float, tool.params_park_y|float, tool.params_park_z|float %}
    {% set path = tool.params_pickup_path %}
    G90
    G0 Y{tool.params_safe_y} F{tool.params_fast_speed}
    G0 X{x} Z{z + path[0].get('z', 0)} F{tool.params_fast_speed}
    G0 Y{y + path[0].get('y', 0)} F{tool.params_fast_speed}
    {% for step in path %}
        G0 {% if 'x' in step %}X{x + step.x}{% endif %} {% if 'y' in step %}Y{y + step.y}{% endif %} {% if 'z' in step %}Z{z + step.z}{% endif %} F{tool.params_path_speed * step.get('f', 1)}
        {% if step.get('verify', 0) %}
            VERIFY_TOOL_DETECTED T={tool.tool_number}
        {% endif %}
    {% endfor %}
    G0 Y{tool.params_safe_y} F{tool.params_fast_speed}
