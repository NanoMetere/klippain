# Optional integration with https://github.com/viesturz/klipper-toolchanger
# Choose the toolchanger_tap (per-tool TAPs) or voron_tap (T0-only probe) profile.
# Keep your QGL/Z_TILT and bed mesh includes.
# Copy user_templates/toolchanger/ into your own configuration and read docs/toolchanger.md.
[gcode_macro _USER_VARIABLES]
variable_klippain_toolchanger_enabled: True
variable_extruder_enabled: True
variable_filament_sensor_enabled: True
variable_filament_sensor_names: []
variable_status_leds_control_enabled: True
variable_status_leds_enabled: False
variable_toolchanger_leds_enabled: True
variable_status_leds_logo_led_name: ""
variable_status_leds_nozzle_led_name: ""
gcode:

[include ../../macros/hardware_functions/toolchanger.cfg]
[include ../../macros/hardware_functions/filament_sensors.cfg]
[include ../../macros/helpers/hotend_heater_ctrl.cfg]
[include ../../macros/hardware_functions/status_leds.cfg]
[include lights/config_colors.cfg]
[include ../../macros/base/probing/overrides/toolchanger.cfg]

[input_shaper]
