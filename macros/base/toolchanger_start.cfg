# Runtime helpers for used-tool START_PRINT heating and bounded per-tool primelines.
[gcode_macro _KLIPPAIN_TOOLCHANGER_PRIMELINES]
gcode:
    {% set start = printer['gcode_macro START_PRINT'] %}
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% set declared = start.tool_temperatures|dictsort|map(attribute=0)|list %}
    {% set prime_all_used_tools = vars.toolchanger_prime_all_used_tools|default(True) %}
    {% set used = declared if prime_all_used_tools else [start.initial_tool] %}
    {% set pending = namespace(numbers=[]) %}
    {% for number in used %}{% if number not in start.primed_tools %}{% set pending.numbers = pending.numbers + [number] %}{% endif %}{% endfor %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        { action_raise_error('Home XYZ before printing toolchanger primelines.') }
    {% endif %}
    {% set direction = vars.prime_line_direction|string|upper %}
    {% if direction not in ['X', 'Y'] %}
        { action_raise_error('Prime line direction must be X or Y.') }
    {% endif %}
    {% set length = vars.prime_line_length|float %}
    {% set height = vars.prime_line_height|default(0.6)|float %}
    {% set requested_purge = vars.prime_line_purge_distance|float %}
    {% set flow = vars.prime_line_flowrate|float %}
    {% if length != length or height != height or requested_purge != requested_purge or flow != flow or length <= 0 or height <= 0 or requested_purge <= 0 or flow <= 0 or length > 10000 or height > 100 or requested_purge > 10000 or flow > 100000 %}
        { action_raise_error('Toolchanger prime line length, height, purge length and flow must be positive.') }
    {% endif %}
    {% set min_x = printer.toolhead.axis_minimum.x|float %}
    {% set min_y = printer.toolhead.axis_minimum.y|float %}
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set bed_min = vars.toolchanger_prime_bed_min|default([min_x if min_x > 0 else 0, min_y if min_y > 0 else 0]) %}
    {% set bed_max = vars.toolchanger_prime_bed_max|default([max_x, max_y]) %}
    {% set gmove = printer.gcode_move %}
    {% set base_x = gmove.position.x|float - gmove.gcode_position.x|float %}
    {% set base_y = gmove.position.y|float - gmove.gcode_position.y|float %}
    {% set base_z = gmove.position.z|float - gmove.gcode_position.z|float %}
    {% set common = namespace(xmin=bed_min[0]|float, xmax=bed_max[0]|float, ymin=bed_min[1]|float, ymax=bed_max[1]|float, widths=[], purges=[], widest=0.0) %}
    {% set first_tool = namespace(number=none) %}
    {% for candidate in pending.numbers %}
        {% if candidate != start.initial_tool and first_tool.number is none %}{% set first_tool.number = candidate %}{% endif %}
    {% endfor %}
    {% if first_tool.number is none and start.initial_tool in pending.numbers %}
        {% set first_tool.number = start.initial_tool %}
    {% endif %}
    {% for number in used %}
        {% set tool_name = printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(number)] %}
        {% set tool = printer[tool_name] %}
        {% set extruder_config = printer.configfile.settings[tool.extruder] %}
        {% set diameter = extruder_config.filament_diameter|default(1.75)|float %}
        {% set max_cross = extruder_config.max_extrude_cross_section|default(0.64)|float %}
        {% if diameter != diameter or max_cross != max_cross or diameter <= 0 or max_cross <= 0 or diameter > 10 or max_cross > 100000 %}
            { action_raise_error('Tool %d has invalid filament or max_extrude_cross_section settings.' % number) }
        {% endif %}
        {% set purge = requested_purge %}
        {% set volume = purge * 3.14159 * (diameter / 2)**2 %}
        {% set width = volume / (height * length) %}
        {% if height * width > max_cross %}
            {% set purge = 0.98 * (max_cross * length) / (3.14159 * (diameter / 2)**2) %}
            {% set volume = purge * 3.14159 * (diameter / 2)**2 %}
            {% set width = volume / (height * length) %}
        {% endif %}
        {% if width != width or width <= 0 or width > 10000 or height / width >= 0.5 %}
            { action_raise_error('Tool %d cannot produce a safe, adherent prime line with the configured dimensions.' % number) }
        {% endif %}
        {% set common.widths = common.widths + [width] %}
        {% set common.purges = common.purges + [purge] %}
        {% set common.widest = [common.widest, width]|max %}
        {% set tool_x = tool.gcode_x_offset|default(0)|float %}
        {% set tool_y = tool.gcode_y_offset|default(0)|float %}
        {% set common.xmin = [common.xmin, min_x - base_x - tool_x]|max %}
        {% set common.xmax = [common.xmax, max_x - base_x - tool_x]|min %}
        {% set common.ymin = [common.ymin, min_y - base_y - tool_y]|max %}
        {% set common.ymax = [common.ymax, max_y - base_y - tool_y]|min %}
        {% set tool_z = tool.gcode_z_offset|default(0)|float %}
        {% set commanded_min_z = printer.toolhead.axis_minimum.z|float - base_z - tool_z %}
        {% set commanded_max_z = printer.toolhead.axis_maximum.z|float - base_z - tool_z %}
        {% if number in pending.numbers %}
            {% set entry_command_z = gmove.gcode_position.z|float if number == first_tool.number else height + 3 %}
            {% set entry_z = entry_command_z + base_z + tool_z %}
            {% if height < commanded_min_z or height + 3 > commanded_max_z or entry_z < printer.toolhead.axis_minimum.z or entry_z > printer.toolhead.axis_maximum.z or (entry_z < 5 and (5 < printer.toolhead.axis_minimum.z or 5 > printer.toolhead.axis_maximum.z)) %}
                { action_raise_error('T%d prime line and Z hop do not fit its physical Z travel after offsets.' % number) }
            {% endif %}
        {% endif %}
    {% endfor %}
    {% set bound_min_x = common.xmin + 1 %}{% set bound_max_x = common.xmax - 1 %}
    {% set bound_min_y = common.ymin + 1 %}{% set bound_max_y = common.ymax - 1 %}
    {% set xmin = bound_min_x + common.widest / 2 %}
    {% set xmax = bound_max_x - common.widest / 2 %}
    {% set ymin = bound_min_y + common.widest / 2 %}
    {% set ymax = bound_max_y - common.widest / 2 %}
    {% set pitch = common.widest + 2 %}
    {% set span = (used|length - 1) * pitch %}
    {% set along_min = xmin if direction == 'X' else ymin %}
    {% set along_max = xmax if direction == 'X' else ymax %}
    {% set cross_min = ymin if direction == 'X' else xmin %}
    {% set cross_max = ymax if direction == 'X' else xmax %}
    {% set along_center = (along_min + along_max) / 2 %}
    {% set cross_center = (cross_min + cross_max) / 2 %}
    {% if length > along_max - along_min or span > cross_max - cross_min %}
        { action_raise_error('All used tools cannot fit distinct primelines inside the shared bed and tool travel limits.') }
    {% endif %}
    # Preserve the ordinary adaptive preferred origin and mirror/margin behavior.
    {% set preferred_x, preferred_y = vars.prime_line_xy|map('float') %}
    {% set found = false %}
    {% if params.SIZE is defined and params.SIZE != '0_0_0_0' %}
        {% set x0, y0, x1, y1 = params.SIZE.split('_')|map('trim')|map('float') %}
        {% set found = true %}
    {% elif printer.exclude_object is defined and printer.exclude_object.objects %}
        {% set points = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
        {% set x0 = points|map(attribute=0)|min %}{% set y0 = points|map(attribute=1)|min %}
        {% set x1 = points|map(attribute=0)|max %}{% set y1 = points|map(attribute=1)|max %}
        {% set found = true %}
    {% endif %}
    {% set center_x = (min_x + max_x) / 2 %}{% set center_y = (min_y + max_y) / 2 %}
    {% if found and params.ADAPTIVE_MODE|default(1)|int == 1 %}
        {% set preferred_x = 2*center_x-preferred_x if (preferred_x > center_x and x1 < center_x) or (preferred_x < center_x and x0 > center_x) else preferred_x %}
        {% set preferred_y = 2*center_y-preferred_y if (preferred_y > center_y and y1 < center_y) or (preferred_y < center_y and y0 > center_y) else preferred_y %}
        {% set preferred_x = [[preferred_x, x0-vars.prime_line_margin|default(5)|float]|max, x1+vars.prime_line_margin|default(5)|float]|min %}
        {% set preferred_y = [[preferred_y, y0-vars.prime_line_margin|default(5)|float]|max, y1+vars.prime_line_margin|default(5)|float]|min %}
    {% endif %}
    {% set along_pref = preferred_x if direction == 'X' else preferred_y %}
    {% set cross_pref = preferred_y if direction == 'X' else preferred_x %}
    {% set way = -1 if along_pref > along_center else 1 %}
    {% set lane_sign = -1 if cross_pref > cross_center else 1 %}
    {% set along_low = along_min if way > 0 else along_min + length %}
    {% set along_high = along_max - length if way > 0 else along_max %}
    {% set cross_low = cross_min if lane_sign > 0 else cross_min + span %}
    {% set cross_high = cross_max - span if lane_sign > 0 else cross_max %}
    {% set along_base = [[along_pref, along_low]|max, along_high]|min %}
    {% set cross_base = [[cross_pref, cross_low]|max, cross_high]|min %}
    {% set plan = namespace(lines=[]) %}
    {% for number in used %}
        {% set tool_index = used.index(number) %}
        {% set along = along_base %}
        {% set cross = cross_base + tool_index * pitch * lane_sign %}
        {% set px = along if direction == 'X' else cross %}
        {% set py = cross if direction == 'X' else along %}
        {% set plan.lines = plan.lines + [{'tool':number, 'x':px, 'y':py, 'purge':common.purges[tool_index]}] %}
    {% endfor %}
    {% set ordered = namespace(lines=[]) %}
    {% for line in plan.lines %}{% if line.tool != start.initial_tool %}{% set ordered.lines = ordered.lines + [line] %}{% endif %}{% endfor %}
    {% for line in plan.lines %}{% if line.tool == start.initial_tool %}{% set ordered.lines = ordered.lines + [line] %}{% endif %}{% endfor %}
    {% for line in ordered.lines %}
        {% if line.tool in pending.numbers %}
            _KLIPPAIN_PRIME_TOOL T={line.tool} X={line.x} Y={line.y} WAY={way} DIRECTION={direction} LENGTH={length} HEIGHT={height} PURGE={line.purge} BOUNDS_MIN_X={bound_min_x} BOUNDS_MAX_X={bound_max_x} BOUNDS_MIN_Y={bound_min_y} BOUNDS_MAX_Y={bound_max_y}
        {% endif %}
    {% endfor %}
    _KLIPPAIN_SELECT_TOOL T={start.initial_tool} CLEANUP=0
    _KLIPPAIN_ASSERT_TOOLCHANGER T={start.initial_tool}

[gcode_macro _KLIPPAIN_PRIME_TOOL]
gcode:
    {% set number = params.T|int %}
    {% if number not in printer['gcode_macro START_PRINT'].primed_tools %}
        _KLIPPAIN_SELECT_TOOL T={number} CLEANUP=0
        _KLIPPAIN_PRIME_TOOL_READY T={number} X={params.X} Y={params.Y} WAY={params.WAY} DIRECTION={params.DIRECTION} LENGTH={params.LENGTH} HEIGHT={params.HEIGHT} PURGE={params.PURGE} BOUNDS_MIN_X={params.BOUNDS_MIN_X} BOUNDS_MAX_X={params.BOUNDS_MAX_X} BOUNDS_MIN_Y={params.BOUNDS_MIN_Y} BOUNDS_MAX_Y={params.BOUNDS_MAX_Y}
    {% endif %}

[gcode_macro _KLIPPAIN_PRIME_TOOL_READY]
gcode:
    {% set number = params.T|int %}
    {% if printer.toolchanger.status != 'ready' or printer.toolchanger.tool_number != number or printer.toolchanger.detected_tool_number != number or printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed %}
        { action_raise_error('T%d is not the detected, selected, ready tool; refusing to heat or prime it.' % number) }
    {% endif %}
    _KLIPPAIN_ASSERT_TOOLCHANGER T={number}
    M109 S{printer['gcode_macro START_PRINT'].tool_temperatures[number]}
    PRIMELINE START_X={params.X} START_Y={params.Y} LINE_WAY={params.WAY} LINE_DIRECTION={params.DIRECTION} LINE_LENGTH={params.LENGTH} LINE_HEIGHT={params.HEIGHT} PURGE_LENGTH={params.PURGE} ADAPTIVE_MODE=0 BOUNDED=1 EXPECT_TOOL={number} BOUNDS_MIN_X={params.BOUNDS_MIN_X} BOUNDS_MAX_X={params.BOUNDS_MAX_X} BOUNDS_MIN_Y={params.BOUNDS_MIN_Y} BOUNDS_MAX_Y={params.BOUNDS_MAX_Y}
    _KLIPPAIN_PRIME_TOOL_COMPLETE T={number}

[gcode_macro _KLIPPAIN_PRIME_TOOL_COMPLETE]
gcode:
    {% set number = params.T|int %}
    {% if printer.toolchanger.status != 'ready' or printer.toolchanger.tool_number != number or printer.toolchanger.detected_tool_number != number or printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed %}
        { action_raise_error('T%d is not the detected, selected, ready tool; refusing to mark it primed.' % number) }
    {% endif %}
    _KLIPPAIN_ASSERT_TOOLCHANGER T={number}
    {% set completed = printer['gcode_macro START_PRINT'].primed_tools %}
    {% if number not in completed %}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=primed_tools VALUE="{completed + [number]}"
    {% endif %}
