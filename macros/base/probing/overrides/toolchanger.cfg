# Manual probe commands need the same T0 selection and TAP temperature guard as
# QGL, Z_TILT and bed mesh. Internal probe sessions additionally use activate_gcode.
[gcode_macro PROBE]
rename_existing: _KLIPPAIN_BASE_PROBE
gcode:
    _KLIPPAIN_PREPARE_PROBE
    ACTIVATE_PROBE
    _KLIPPAIN_BASE_PROBE {rawparams}
    DEACTIVATE_PROBE

[gcode_macro PROBE_ACCURACY]
rename_existing: _KLIPPAIN_BASE_PROBE_ACCURACY
gcode:
    _KLIPPAIN_PREPARE_PROBE
    ACTIVATE_PROBE
    _KLIPPAIN_BASE_PROBE_ACCURACY {rawparams}
    DEACTIVATE_PROBE

[gcode_macro PROBE_CALIBRATE]
rename_existing: _KLIPPAIN_BASE_PROBE_CALIBRATE
gcode:
    _KLIPPAIN_PREPARE_PROBE
    ACTIVATE_PROBE
    _KLIPPAIN_BASE_PROBE_CALIBRATE {rawparams}
    DEACTIVATE_PROBE
