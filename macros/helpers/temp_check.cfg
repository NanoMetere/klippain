[gcode_macro _LOW_TEMP_CHECK]
description: Check the nozzle is at temperature and heat it if needed
gcode: 
    {% set T = params.T|default(printer["gcode_macro _USER_VARIABLES"].print_default_extruder_temp)|float %}
    {% set MIN_EXTRUDE_TEMP = printer.configfile.config[printer.toolhead.extruder].min_extrude_temp|float %}

    {% if printer[printer.toolhead.extruder].target != 0 and printer[printer.toolhead.extruder].target >= MIN_EXTRUDE_TEMP %}
        {% if printer[printer.toolhead.extruder].temperature < printer[printer.toolhead.extruder].target %}
            M109 S{printer[printer.toolhead.extruder].target|float}
        {% endif %}
    {% else %}
        {% if printer[printer.toolhead.extruder].target < T %}
            M109 S{T}
        {% endif %}
    {% endif %}
    {% if printer['gcode_macro _USER_VARIABLES'].klippain_toolchanger_enabled|default(False) and printer.toolchanger.tool_number >= 0 and (printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].retract_debts|default({})).get(printer.toolchanger.tool_number, 0)|float > 0 %}
        _KLIPPAIN_TOOL_RESTORE T={printer.toolchanger.tool_number} REQUIRE=1
    {% endif %}
