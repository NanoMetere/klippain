# Low thermal inertia hotend workaround and optional tool-aware temperature routing.
# Keep one M109 definition; do not additionally include upstream macros.cfg.
[gcode_macro M104]
rename_existing: M104.1
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% if vars.klippain_toolchanger_enabled|default(False) %}
        {% set tc = printer.toolchanger %}
        {% set number = params.T|default(tc.tool_number)|int %}
        {% set target = params.S|default(0)|float %}
        {% set restore = not (params.RESTORE0 is defined) and params.RESTORE|default('1')|string|replace('=', '')|int != 0 %}
        {% set debts = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].retract_debts|default({}) %}
        {% set probe_active = ('gcode_macro _PROBE_FRAMEWORK_STATE' in printer and printer['gcode_macro _PROBE_FRAMEWORK_STATE'].active) %}
        {% if number in tc.tool_numbers %}
            SET_TOOL_TEMPERATURE T={number} TARGET={target}
            {% set tool = printer[tc.tool_names[tc.tool_numbers.index(number)]] %}
            {% set min_extrude = printer.configfile.config[tool.extruder].min_extrude_temp|default(170)|float %}
            {% if restore and not probe_active and number == tc.tool_number and target > 0 and target >= min_extrude and debts.get(number, 0)|float > 0 and tc.detected_tool_number == number and tc.status == 'ready' and not printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed %}
                # M104 remains asynchronous for parked tools. For a selected tool with
                # repayment debt, wait here so the next extrusion cannot pass it cold.
                M109 T{number} S{target} RESTORE1
            {% endif %}
        {% elif params.T is defined %}
            { action_raise_error('M104 references an unconfigured tool; T must name a configured toolchanger tool.') }
        {% else %}
            M104.1 {rawparams}
        {% endif %}
    {% else %}
        M104.1 {rawparams}
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set S = params.S|default(0)|float %}
    {% set fix = printer['gcode_macro _USER_VARIABLES'].fix_heaters_temperature_settle %}
    {% if printer['gcode_macro _USER_VARIABLES'].klippain_toolchanger_enabled|default(False) %}
        {% set tc = printer.toolchanger %}
        {% set number = params.T|default(tc.tool_number)|int %}
        {% set restore = not (params.RESTORE0 is defined) and params.RESTORE|default('1')|string|replace('=', '')|int != 0 %}
        {% if number not in tc.tool_numbers %}
            { action_raise_error('M109 requires a configured tool; specify T when no tool is selected.') }
        {% endif %}
        {% set tool = printer[tc.tool_names[tc.tool_numbers.index(number)]] %}
        {% set heater = tool.heater|default(tool.extruder, true) %}
        SET_TOOL_TEMPERATURE T={number} TARGET={S} WAIT={0 if fix else 1}
    {% else %}
        {% set heater = printer.toolhead.extruder %}
        {% if fix %}
            M104 {rawparams}
        {% else %}
            M109.1 {rawparams}
        {% endif %}
    {% endif %}
    {% if fix and S != 0 %}
        {% if printer[heater].temperature <= S %}
            TEMPERATURE_WAIT SENSOR={heater} MINIMUM={S}
        {% else %}
            TEMPERATURE_WAIT SENSOR={heater} MAXIMUM={S}
        {% endif %}
    {% endif %}
    {% if printer['gcode_macro _USER_VARIABLES'].klippain_toolchanger_enabled|default(False) and restore and S > 0 and number == tc.tool_number and number == tc.detected_tool_number and tc.status == 'ready' and not printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed and not ('gcode_macro _PROBE_FRAMEWORK_STATE' in printer and printer['gcode_macro _PROBE_FRAMEWORK_STATE'].active) %}
        {% set min_extrude = printer.configfile.config[tool.extruder].min_extrude_temp|default(170)|float %}
        {% if S >= min_extrude %}
            _KLIPPAIN_TOOL_RESTORE T={number} REQUIRE=1
        {% endif %}
    {% endif %}
