# Klippain orchestrates printing; klipper-toolchanger owns tool motion and offsets.
# All state-dependent checks run in separate macros: Klipper renders each entire
# template before executing its commands.
[gcode_macro _KLIPPAIN_TOOLCHANGER]
variable_failed: False
variable_previous_tool: -1
variable_target_tool: -1
variable_paused_tool: -1
variable_paused_temperature: 0
variable_paused_e: 0.0
variable_change_recovery: False
variable_bootstrap_homing: False
variable_retract_debts: {}
gcode:

[gcode_macro _INIT_CHECK_TOOLCHANGER]
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% if vars.klippain_mmu_enabled|default(False) or vars.klippain_ercf_enabled|default(False) %}
        { action_raise_error('Toolchanger and Happy Hare cannot be enabled together yet. Disable one backend.') }
    {% endif %}
    {% if 'toolchanger' not in printer %}
        { action_raise_error('Install klipper-toolchanger and configure [toolchanger] before enabling Klippain Toolchanger support.') }
    {% endif %}
    {% set tc = printer.toolchanger %}
    {% if tc.tool_numbers|length < 2 or tc.tool_numbers|length > 7 or 0 not in tc.tool_numbers %}
        { action_raise_error('Configure 2 to 7 tools, including T0, with tool_number in the range 0 to 6.') }
    {% endif %}
    {% set selection = namespace(count=0, tool_count=0) %}
    {% for count in range(2, 8) %}
        {% if ('gcode_macro _KLIPPAIN_TOOLSET_' ~ count) in printer %}
            {% set selection.count = selection.count + 1 %}
            {% set selection.tool_count = count %}
        {% endif %}
    {% endfor %}
    {% if selection.count > 1 %}
        { action_raise_error('Select exactly one toolchanger/tools_N.cfg include in printer.cfg.') }
    {% elif selection.count == 1 and tc.tool_numbers|sort != range(selection.tool_count)|list %}
        { action_raise_error('The selected tools_N.cfg requires exactly tools T0 through T%d.' % (selection.tool_count - 1)) }
    {% endif %}
    {% if vars.probe_type_enabled != 'vorontap' %}
        { action_raise_error('Klippain Toolchanger currently requires the Voron TAP profile on T0 only.') }
    {% endif %}
    {% if vars.toolchanger_home_with_any_tool|default(False) and not vars.probe_is_toolchanger_tap|default(False) %}
        { action_raise_error('home_with_any_tool requires the toolchanger_tap probe profile and a tool_probe on every tool.') }
    {% endif %}
    {% set actions = vars.startprint_actions %}
    {% if 'extruder_heating' not in actions %}
        { action_raise_error('Toolchanger START_PRINT requires extruder_heating after all probing actions.') }
    {% endif %}
    {% for action in actions[actions.index('extruder_heating') + 1:] %}
        {% if action in ['tilt_calib', 'z_offset', 'bedmesh', 'contact_z_home', 'contact_auto_calibrate', 'beacon_calib'] %}
            { action_raise_error('Put all probing actions before extruder_heating in Toolchanger START_PRINT.') }
        {% endif %}
    {% endfor %}
    {% for number in tc.tool_numbers %}
        {% if number < 0 or number > 6 %}
            { action_raise_error('Tool numbers must be in the range 0 to 6.') }
        {% endif %}
    {% endfor %}
    {% set extruders = namespace(names=[]) %}
    {% set sensors = namespace(names=[]) %}
    {% for name in tc.tool_names %}
        {% set tool = printer[name] %}
        {% if not tool.extruder or tool.extruder not in printer or tool.extruder in extruders.names %}
            { action_raise_error('%s requires a distinct, configured extruder.' % name) }
        {% endif %}
        {% set extruders.names = extruders.names + [tool.extruder] %}
        {% if tool.detect_state == 'unavailable' %}
            { action_raise_error('%s needs a detection_pin for manual recovery and T0-only homing.' % name) }
        {% endif %}
        {% if tool.params_safe_y is not defined or tool.params_safe_y is not number %}
            { action_raise_error('%s requires a numeric params_safe_y clearance plane.' % name) }
        {% endif %}
        {% if vars.probe_is_toolchanger_tap|default(False) and not printer.configfile.config[name].tool_probe|default('') %}
            { action_raise_error('%s requires a tool_probe for the toolchanger_tap profile.' % name) }
        {% endif %}
        {% for sensor in tool.params_filament_sensors|default([]) %}
            {% if sensor in sensors.names %}
                { action_raise_error('Tool-specific filament sensors must not be shared between tools: %s.' % sensor) }
            {% endif %}
            {% set sensors.names = sensors.names + [sensor] %}
            {% if 'filament_switch_sensor ' ~ sensor not in printer and 'filament_motion_sensor ' ~ sensor not in printer %}
                { action_raise_error('%s references missing filament sensor %s.' % (name, sensor)) }
            {% endif %}
        {% endfor %}
        {% if tool.params_led_name|default('') and 'neopixel ' ~ tool.params_led_name not in printer %}
            { action_raise_error('%s references a missing neopixel chain.' % name) }
        {% endif %}
    {% endfor %}
    _INIT_CHECK_TOOL_LEDS
    _KLIPPAIN_TOOL_SENSORS ENABLE=0

[gcode_macro _KLIPPAIN_VALIDATE_INITIAL_TOOL]
gcode:
    {% if params.T|int not in printer.toolchanger.tool_numbers %}
        { action_raise_error('START_PRINT INITIAL_TOOL is not configured.') }
    {% endif %}

[gcode_macro _KLIPPAIN_INITIALIZE_TOOLCHANGER]
gcode:
    {% if printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed %}
        { action_raise_error('Tool change recovery is pending. Manually mount the requested tool and use RESUME.') }
    {% endif %}
    {% if printer.toolchanger.status == 'uninitialized' %}
        INITIALIZE_TOOLCHANGER
    {% endif %}
    _KLIPPAIN_ASSERT_TOOLCHANGER

[gcode_macro _KLIPPAIN_ASSERT_TOOLCHANGER]
gcode:
    {% if printer.toolchanger.status != 'ready' or printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed %}
        { action_raise_error('Toolchanger is not ready. Check tool detection and recover with RESUME before continuing.') }
    {% endif %}
    {% if params.T is defined and printer.toolchanger.tool_number != params.T|int %}
        { action_raise_error('Expected T%s but it is not selected; remaining operations were stopped.' % params.T) }
    {% endif %}

[gcode_macro _KLIPPAIN_SELECT_TOOL]
description: Select a validated tool; optionally purge and wipe after the backend restores print coordinates
gcode:
    {% set number = params.T|int %}
    {% set cleanup = params.CLEANUP|default(1)|int %}
    {% if number not in printer.toolchanger.tool_numbers %}
        { action_raise_error('T%d is not configured.' % number) }
    {% endif %}
    _KLIPPAIN_INITIALIZE_TOOLCHANGER
    _KLIPPAIN_SELECT_TOOL_READY T={number} CLEANUP={cleanup}

[gcode_macro _KLIPPAIN_SELECT_TOOL_READY]
gcode:
    {% set number = params.T|int %}
    {% set changed = printer.toolchanger.tool_number != number %}
    {% if changed and printer.toolhead.homed_axes != 'xyz' %}
        { action_raise_error('Home XYZ before changing tools. For cold homing, manually mount T0 first.') }
    {% endif %}
    {% set target = printer[printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(number)]] %}
    {% if changed and not target.params_docks_calibrated|default(False) %}
        { action_raise_error('Calibrate every dock and set params_docks_calibrated: True before changing tools.') }
    {% endif %}
    SELECT_TOOL T={number} RESTORE_AXIS=XYZ
    # The backend can handle a pickup error without propagating its exception.
    # Check again before allowing any enclosing START_PRINT/END_PRINT to proceed.
    _KLIPPAIN_TOOLCHANGE_FINISH T={number} CLEANUP={params.CLEANUP|int} CHANGED={1 if changed else 0}

[gcode_macro _KLIPPAIN_TOOLCHANGE_FINISH]
gcode:
    {% set failed = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed or printer.toolchanger.status != 'ready' %}
    {% if failed and not params.CLEANUP|int %}
        # Abort an enclosing startup/finish macro. Its virtual-SD line is retained.
        { action_raise_error('Tool change failed; remaining macro operations were stopped. Recover manually before continuing.') }
    {% elif not failed %}
        _KLIPPAIN_ASSERT_TOOLCHANGER T={params.T}
        {% if params.CLEANUP|int %}
            _KLIPPAIN_TOOL_RESTORE T={params.T|int} REQUIRE=0
        {% endif %}
        {% if params.CHANGED|int and params.CLEANUP|int and printer.print_stats.state == 'printing' and not printer.pause_resume.is_paused %}
            _KLIPPAIN_TOOLCHANGE_CLEANUP
        {% endif %}
    {% endif %}
    # A failed standalone Tn returns normally after PAUSE, so virtual_sdcard can
    # advance past that command rather than repeating it on manual RESUME.

[gcode_macro _KLIPPAIN_TOOLCHANGE_BEFORE]
gcode:
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=previous_tool VALUE={params.FROM|int}
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=target_tool VALUE={params.TO|int}
    _KLIPPAIN_TOOL_SENSORS ENABLE=0
    {% if params.FROM|int != params.TO|int %}
        _KLIPPAIN_TOOL_RETRACT T={params.FROM|int}
    {% endif %}

[gcode_macro _KLIPPAIN_TOOL_RETRACT]
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% set state = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'] %}
    {% set number = params.T|int %}
    {% set enabled = vars.toolchanger_retract_on_change|default(True) %}
    {% set tc = printer.toolchanger %}
    {% set tool = printer[tc.tool_names[tc.tool_numbers.index(number)]] if number in tc.tool_numbers else {} %}
    {% if enabled and number in tc.tool_numbers and tool.extruder is defined and tc.status == 'changing' and number == tc.tool_number and number == tc.detected_tool_number and printer.toolhead.extruder == tool.extruder and not state.failed and printer[tool.extruder].can_extrude %}
        {% set length = vars.retract_length|default(20)|float %}
        {% if length < 0 or length|string|lower in ['nan', 'inf', '-inf', 'infinity', '-infinity'] %}
            { action_raise_error('retract_length must be a finite, nonnegative length for toolchange retraction.') }
        {% elif length > 0 %}
            {% set debts = state.retract_debts|default({}) %}
            {% set owed = debts.get(number, 0)|float %}
            {% set retract = [length - owed, 0]|max %}
            {% if retract > 0 %}
                SAVE_GCODE_STATE NAME=KLIPPAIN_TOOL_RETRACT
                M220 S100
                M221 S100
                M83
                G1 E-{retract} F2100
                M400
                {% set updated = {} %}
                {% for key, value in debts.items() %}{% set _ = updated.update({key|int: value|float}) %}{% endfor %}
                {% set _ = updated.update({number: (owed + retract)}) %}
                SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=retract_debts VALUE="{updated}"
                RESTORE_GCODE_STATE NAME=KLIPPAIN_TOOL_RETRACT MOVE=0
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _KLIPPAIN_TOOL_RESTORE]
gcode:
    {% set number = params.T|int %}
    {% set require = params.REQUIRE|default(0)|int %}
    {% set tc = printer.toolchanger %}
    {% set state = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'] %}
    {% set debts = state.retract_debts|default({}) %}
    {% set owed = debts.get(number, 0)|float %}
    {% set tool = printer[tc.tool_names[tc.tool_numbers.index(number)]] if number in tc.tool_numbers else {} %}
    {% set confirmed = number in tc.tool_numbers and tc.status == 'ready' and tc.tool_number == number and tc.detected_tool_number == number and not state.failed %}
    {% set min_extrude = printer.configfile.config[tool.extruder].min_extrude_temp|default(170)|float if tool.extruder is defined else 170 %}
    {% set probe_active = 'gcode_macro _PROBE_FRAMEWORK_STATE' in printer and printer['gcode_macro _PROBE_FRAMEWORK_STATE'].active %}
    {% set can_restore = confirmed and not probe_active and tool.extruder is defined and printer.toolhead.extruder == tool.extruder and printer[tool.extruder].target|float >= min_extrude and printer[tool.extruder].target|float > 0 and printer[tool.extruder].can_extrude %}
    {% if owed > 0 and can_restore %}
        SAVE_GCODE_STATE NAME=KLIPPAIN_TOOL_RESTORE
        M220 S100
        M221 S100
        M83
        G1 E{owed} F2100
        M400
        {% set updated = {} %}
        {% for key, value in debts.items() %}
            {% if key|int != number %}{% set _ = updated.update({key|int: value|float}) %}{% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=retract_debts VALUE="{updated}"
        RESTORE_GCODE_STATE NAME=KLIPPAIN_TOOL_RESTORE MOVE=0
    {% elif owed > 0 and require %}
        { action_raise_error('T%d has %.3f mm of toolchange retraction debt, but is not confirmed selected and hot enough to restore safely.' % (number, owed)) }
    {% endif %}

[gcode_macro _KLIPPAIN_TOOLCHANGE_AFTER]
gcode:
    {% set tool = printer[printer.toolchanger.tool] %}
    {% if tool.params_pressure_advance is defined %}
        SET_PRESSURE_ADVANCE EXTRUDER={tool.extruder} ADVANCE={tool.params_pressure_advance} SMOOTH_TIME={tool.params_pressure_advance_smooth_time|default(0.04)}
    {% endif %}
    # Always set both axes, including zero: never retain the previous tool's shaper.
    {% set shaper = printer.configfile.settings.input_shaper|default({}) %}
    SET_INPUT_SHAPER SHAPER_FREQ_X={tool.params_input_shaper_freq_x|default(shaper.shaper_freq_x|default(0))} SHAPER_FREQ_Y={tool.params_input_shaper_freq_y|default(shaper.shaper_freq_y|default(0))} SHAPER_TYPE_X={tool.params_input_shaper_type_x|default(shaper.shaper_type_x|default('mzv'))} SHAPER_TYPE_Y={tool.params_input_shaper_type_y|default(shaper.shaper_type_y|default('mzv'))} DAMPING_RATIO_X={tool.params_input_shaper_damping_ratio_x|default(shaper.damping_ratio_x|default(0.1))} DAMPING_RATIO_Y={tool.params_input_shaper_damping_ratio_y|default(shaper.damping_ratio_y|default(0.1))}
    _KLIPPAIN_TOOL_SENSORS ENABLE=1
    _KLIPPAIN_TOOL_LEDS

[gcode_macro _KLIPPAIN_TOOLCHANGE_CLEANUP]
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% if vars.toolchanger_purge_on_change|default(False) or vars.toolchanger_wipe_on_change|default(False) %}
        SAVE_GCODE_STATE NAME=KLIPPAIN_TOOLCHANGE_CLEANUP
        {% if vars.toolchanger_purge_on_change|default(False) %}
            PURGE TEMP={printer[printer.toolhead.extruder].target}
        {% endif %}
        {% if vars.toolchanger_wipe_on_change|default(False) %}
            CLEAN_NOZZLE
        {% endif %}
        RESTORE_GCODE_STATE NAME=KLIPPAIN_TOOLCHANGE_CLEANUP MOVE=1 MOVE_SPEED={vars.travel_speed}
    {% endif %}
    {% if vars.status_leds_control_enabled|default(False) %}
        STATUS_LEDS COLOR=printing
    {% endif %}

[gcode_macro _KLIPPAIN_TOOLCHANGE_ERROR]
gcode:
    {% set state = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'] %}
    {% set target = params.TARGET|int %}
    {% set previous = state.previous_tool if params.CHANGING|default(1)|int else printer.toolchanger.tool_number %}
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% set failed_tool = printer[printer.toolchanger.tool] if printer.toolchanger.tool else {} %}
    {% set safe_y = failed_tool.params_safe_y|default(none) %}
    {% if params.CHANGING|default(0)|int and target in printer.toolchanger.tool_numbers %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=change_recovery VALUE=True
    {% elif not printer.pause_resume.is_paused %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=change_recovery VALUE=False
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=failed VALUE=True
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=previous_tool VALUE={previous}
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=target_tool VALUE={target}
    {% if target in printer.toolchanger.tool_numbers %}
        {% set target_tool = printer[printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(target)]] %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=paused_temperature VALUE={printer[target_tool.extruder].target}
    {% endif %}
    { action_respond_info('Tool change failed: previous T%d, target T%d. Manually mount T%d, then press RESUME. No automatic docking retry will run.' % (previous, target, target)) }
    _KLIPPAIN_TOOL_SENSORS ENABLE=0
    _KLIPPAIN_TOOL_LEDS COLOR=error
    {% if printer.toolhead.homed_axes == 'xyz' and safe_y is not none and safe_y >= printer.toolhead.axis_minimum.y and safe_y <= printer.toolhead.axis_maximum.y %}
        SAVE_GCODE_STATE NAME=KLIPPAIN_ERROR_RETREAT
        # Use a relative delta to reach physical safe_y even with user/tool offsets.
        G91
        G0 Y{safe_y - printer.toolhead.position.y} F{vars.toolchanger_error_retreat_speed|default(50)|float * 60}
        RESTORE_GCODE_STATE NAME=KLIPPAIN_ERROR_RETREAT MOVE=0
        PAUSE TOOLCHANGE_ERROR=1
    {% else %}
        { action_respond_info('Cannot perform the configured Y retreat within homed travel limits; paused without moving or parking.') }
        PAUSE TOOLCHANGE_ERROR=1 PARK=0
    {% endif %}

[gcode_macro _KLIPPAIN_TOOLCHANGER_HOME]
gcode:
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=bootstrap_homing VALUE=False
    _KLIPPAIN_INITIALIZE_TOOLCHANGER
    _KLIPPAIN_TOOLCHANGER_HOME_READY

[gcode_macro _KLIPPAIN_TOOLCHANGER_HOME_READY]
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% if printer.toolchanger.tool_number != 0 and printer.toolhead.homed_axes != 'xyz' and vars.toolchanger_home_with_any_tool|default(False) %}
        {% if not vars.probe_is_toolchanger_tap|default(False) or printer.toolchanger.detected_tool_number != printer.toolchanger.tool_number or printer.toolchanger.tool_number < 0 %}
            { action_raise_error('Bootstrap homing requires a detected mounted tool with its own TAP.') }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=bootstrap_homing VALUE=True
    {% else %}
        _KLIPPAIN_SELECT_TOOL_READY T=0 CLEANUP=0
    {% endif %}
    _KLIPPAIN_ASSERT_PROBE_TOOL

[gcode_macro _KLIPPAIN_TOOLCHANGER_HOME_FINISH]
gcode:
    {% if printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].bootstrap_homing %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=bootstrap_homing VALUE=False
        _KLIPPAIN_SELECT_TOOL T=0 CLEANUP=0
        _KLIPPAIN_TOOLCHANGER_REHOME_T0
    {% endif %}

[gcode_macro _KLIPPAIN_TOOLCHANGER_REHOME_T0]
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    _KLIPPAIN_ASSERT_PROBE_TOOL
    ACTIVATE_PROBE SOURCE=homing
    # This runs within homing_override, so G28 Z invokes native Z homing.
    G28 Z
    ADJUST_Z_AFTER_TOOL_NOZZLE_HOME
    G91
    G0 Z{vars.homing_zhop|float|abs} F{vars.z_drop_speed * 60}
    G90
    DEACTIVATE_PROBE SOURCE=homing

[gcode_macro _KLIPPAIN_ASSERT_PROBE_TOOL]
gcode:
    {% set bootstrap = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].bootstrap_homing and printer['gcode_macro _USER_VARIABLES'].toolchanger_home_with_any_tool|default(False) %}
    {% if printer.toolchanger.status != 'ready' or printer.toolchanger.detected_tool_number != printer.toolchanger.tool_number or (printer.toolchanger.tool_number != 0 and not bootstrap) %}
        { action_raise_error('Probing requires detected and selected T0. Manually mount T0 before cold homing; otherwise select T0 after homing XYZ.') }
    {% endif %}

[gcode_macro _KLIPPAIN_PREPARE_PROBE]
gcode:
    {% set bootstrap = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].bootstrap_homing and params.SOURCE|default('manual') == 'homing' %}
    {% if not bootstrap %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=bootstrap_homing VALUE=False
        _KLIPPAIN_SELECT_TOOL T=0 CLEANUP=0
    {% endif %}
    _KLIPPAIN_ASSERT_PROBE_TOOL

[gcode_macro _KLIPPAIN_TOOLCHANGER_END]
gcode:
    # T0 must be selected BEFORE PARK, retraction, cooling, or motor shutdown.
    {% if printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed %}
        {% if printer.toolchanger.detected_tool_number != 0 %}
            { action_raise_error('Manually mount T0 before ending or cancelling after a tool change failure.') }
        {% endif %}
        INITIALIZE_TOOLCHANGER T=0
        _KLIPPAIN_TOOLCHANGER_END_RECOVERED
    {% endif %}
    _KLIPPAIN_SELECT_TOOL T=0 CLEANUP=0
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=change_recovery VALUE=False
    {% if printer.toolhead.homed_axes == 'xyz' %}
        PARK
    {% endif %}

[gcode_macro _KLIPPAIN_TOOLCHANGER_END_RECOVERED]
gcode:
    _KLIPPAIN_ASSERT_PROBE_TOOL
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=failed VALUE=False
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=change_recovery VALUE=False

[gcode_macro _KLIPPAIN_TOOLCHANGER_PAUSE]
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% if not printer.pause_resume.is_paused %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=paused_e VALUE={printer.gcode_move.gcode_position.e}
        {% if not printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed %}
            SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=change_recovery VALUE=False
            SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=paused_tool VALUE={printer.toolchanger.tool_number}
            SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=paused_temperature VALUE={printer[printer.toolhead.extruder].target}
        {% endif %}
        BASE_PAUSE
        {% if params.PARK|default(1)|int and printer.toolhead.homed_axes == 'xyz' %}
            PARK {% if params.TOOLCHANGE_ERROR|default(0)|int %}E=0{% endif %}
        {% endif %}
        {% if vars.turn_off_extruder_on_pause and not params.TOOLCHANGE_ERROR|default(0)|int %}
            M104 S0
        {% endif %}
        {% if vars.idle_timeout_on_pause|default(0)|int > 0 %}
            SET_IDLE_TIMEOUT TIMEOUT={vars.idle_timeout_on_pause}
        {% endif %}
    {% endif %}

[gcode_macro _KLIPPAIN_TOOLCHANGER_RESUME]
gcode:
    {% set state = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'] %}
    {% if not printer.pause_resume.is_paused %}
        { action_raise_error('Print is not paused.') }
    {% endif %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        { action_raise_error('XYZ position was lost. Cancel and rehome instead of resuming this print.') }
    {% endif %}
    {% if state.failed %}
        {% if state.target_tool not in printer.toolchanger.tool_numbers or printer.toolchanger.detected_tool_number != state.target_tool %}
            { action_raise_error('Previous T%d, target T%d: manually mount the target tool and move clear of the dock before RESUME.' % (state.previous_tool, state.target_tool)) }
        {% endif %}
        # Recognition only; do not retry SELECT_TOOL or RECOVER=1 docking movements.
        INITIALIZE_TOOLCHANGER T={state.target_tool}
        _KLIPPAIN_TOOLCHANGER_RECOVERED
    {% else %}
        _KLIPPAIN_SELECT_TOOL T={state.paused_tool} CLEANUP=0
    {% endif %}
    _KLIPPAIN_TOOLCHANGER_RESUME_READY {rawparams}

[gcode_macro _KLIPPAIN_TOOLCHANGER_RECOVERED]
gcode:
    {% set state = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'] %}
    {% if printer.toolchanger.status != 'ready' or printer.toolchanger.tool_number != state.target_tool or printer.toolchanger.detected_tool_number != state.target_tool %}
        { action_raise_error('Manual recovery verification failed. Print remains paused.') }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=paused_tool VALUE={state.target_tool}
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=failed VALUE=False

[gcode_macro _KLIPPAIN_TOOLCHANGER_RESUME_READY]
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% set state = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'] %}
    _KLIPPAIN_ASSERT_TOOLCHANGER
    VERIFY_TOOL_DETECTED T={printer.toolchanger.tool_number}
    {% if state.paused_temperature > 0 %}
        SET_TOOL_TEMPERATURE T={printer.toolchanger.tool_number} TARGET={state.paused_temperature} WAIT=1
    {% endif %}
    _KLIPPAIN_TOOLCHANGER_RESUME_FINISH T={printer.toolchanger.tool_number} {rawparams}

[gcode_macro _KLIPPAIN_TOOLCHANGER_RESUME_FINISH]
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% set state = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'] %}
    {% set number = params.T|int %}
    {% set velocity = params.VELOCITY|default(printer.configfile.settings.pause_resume.recover_velocity|default(50))|float %}
    {% set tc = printer.toolchanger %}
    {% set tool = printer[tc.tool_names[tc.tool_numbers.index(number)]] if number in tc.tool_numbers else {} %}
    {% if printer.toolhead.homed_axes != 'xyz' or tc.status != 'ready' or state.failed or number not in tc.tool_numbers or tc.tool_number != number or tc.detected_tool_number != number or tool.extruder is not defined or printer.toolhead.extruder != tool.extruder %}
        { action_raise_error('Toolchanger recovery lost its confirmed XYZ/tool state after heating; print remains paused.') }
    {% endif %}
    {% if state.change_recovery %}
        # Repair the pinned backend's PAUSE_STATE position frame with its preserved
        # prechange state, using the now active and manually verified tool transform.
        RESTORE_GCODE_STATE NAME=_toolchange_state MOVE=1 MOVE_SPEED={velocity}
    {% endif %}
    {% if (state.retract_debts|default({})).get(number, 0)|float > 0 %}
        _KLIPPAIN_TOOL_RESTORE T={number} REQUIRE=1
    {% endif %}
    {% if state.change_recovery %}
        # Recover original PAUSE modes/factors, then rebuild PAUSE_STATE with the
        # corrected current XYZ and E vector. MOVE=0 does not move the nozzle.
        RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=0
        G92 E{state.paused_e}
        SAVE_GCODE_STATE NAME=PAUSE_STATE
    {% endif %}
    _KLIPPAIN_TOOL_SENSORS ENABLE=1
    {% if vars.idle_timeout_on_pause|default(0)|int > 0 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    {% endif %}
    {% if vars.status_leds_control_enabled|default(False) %}
        STATUS_LEDS COLOR=printing
    {% endif %}
    # Keep the native resume path; never restore Klippain's separate PAUSE_state.
    BASE_RESUME {rawparams}
    # Pinned process_error corrupts the saved E origin after PAUSE returns.
    G92 E{state.paused_e}
    SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOLCHANGER VARIABLE=change_recovery VALUE=False

[gcode_macro _KLIPPAIN_TOOL_SENSORS]
gcode:
    {% set enable = params.ENABLE|int %}
    {% set state = printer['gcode_macro _KLIPPAIN_TOOLCHANGER'] %}
    {% set depth = printer['gcode_macro _KLIPPAIN_FILAMENT_SENSOR_STATE'].disable_depth %}
    {% for name in printer.toolchanger.tool_names %}
        {% set tool = printer[name] %}
        {% set active = enable and tool.tool_number == printer.toolchanger.tool_number and not state.failed and depth == 0 %}
        {% for sensor in tool.params_filament_sensors|default([]) %}
            SET_FILAMENT_SENSOR SENSOR={sensor} ENABLE={1 if active else 0}
        {% endfor %}
    {% endfor %}

[gcode_macro _KLIPPAIN_TOOL_LEDS]
variable_color: 'ready'
gcode:
    {% set state = printer['gcode_macro _KLIPPAIN_TOOL_LEDS'] %}
    {% set color = params.COLOR|default(state.color)|lower %}
    {% set colors = {'ready': 'standby', 'busy': 'busy', 'heating': 'heating', 'leveling': 'leveling', 'homing': 'homing', 'cleaning': 'cleaning', 'meshing': 'meshing', 'calibrating_z': 'calibrating_z', 'printing': 'printing', 'done_printing': 'done_printing', 'error': 'error', 'off': 'off', 'on': 'on', 'shutdown': 'off'} %}
    {% set valid = colors.keys()|list %}
    {% if color not in valid %}
        { action_raise_error('Unknown tool LED status COLOR=%s.' % color) }
    {% endif %}
    {% if printer['gcode_macro _KLIPPAIN_TOOLCHANGER'].failed and color not in ['off', 'shutdown'] %}
        {% set color = 'error' %}
    {% endif %}
    {% if params.COLOR is defined %}
        SET_GCODE_VARIABLE MACRO=_KLIPPAIN_TOOL_LEDS VARIABLE=color VALUE='"{color}"'
    {% endif %}
    {% if printer['gcode_macro _USER_VARIABLES'].toolchanger_leds_enabled|default(True) %}
        {% for name in printer.toolchanger.tool_names %}
            {% set tool = printer[name] %}
            {% if tool.params_led_name|default('') %}
                {% set active = tool.tool_number == printer.toolchanger.tool_number %}
                {% set logo = colors[color] if active or color in ['error', 'off', 'shutdown'] else 'standby' %}
                {% set nozzle = 'on' if active and color in ['busy', 'leveling', 'homing', 'cleaning', 'meshing', 'calibrating_z', 'printing'] else ('heating' if active and color == 'heating' else logo) %}
                {% set prefix = tool.params_led_effect_prefix|default('tc_t%d' % tool.tool_number) %}
                SET_LED_EFFECT EFFECT={prefix}_logo_{logo} REPLACE=1 FADETIME=0.5
                SET_LED_EFFECT EFFECT={prefix}_nozzle_{nozzle} REPLACE=1 FADETIME=0.5
            {% endif %}
        {% endfor %}
    {% endif %}

[gcode_macro _INIT_CHECK_TOOL_LEDS]
gcode:
    {% if printer['gcode_macro _USER_VARIABLES'].toolchanger_leds_enabled|default(True) %}
        {% set seen = namespace(prefixes=[]) %}
        {% set owned = namespace(pixels=[]) %}
        {% set effects = ['logo_standby', 'logo_busy', 'logo_heating', 'logo_leveling', 'logo_homing', 'logo_cleaning', 'logo_meshing', 'logo_calibrating_z', 'logo_printing', 'logo_done_printing', 'logo_error', 'logo_on', 'logo_off', 'nozzle_standby', 'nozzle_heating', 'nozzle_done_printing', 'nozzle_error', 'nozzle_on', 'nozzle_off', 'startup', 'critical_error'] %}
        {% for name in printer.toolchanger.tool_names %}
            {% set tool = printer[name] %}
            {% if tool.params_led_name|default('') %}
                {% set prefix = tool.params_led_effect_prefix|default('tc_t%d' % tool.tool_number) %}
                {% if prefix in seen.prefixes %}
                    { action_raise_error('%s duplicates LED effect prefix %s.' % (name, prefix)) }
                {% endif %}
                {% set seen.prefixes = seen.prefixes + [prefix] %}
                {% if 'neopixel ' ~ tool.params_led_name not in printer %}
                    { action_raise_error('%s LED effects reference missing neopixel %s.' % (name, tool.params_led_name)) }
                {% endif %}
                {% set led_config = printer.configfile.config['neopixel ' ~ tool.params_led_name] %}
                {% set chain_count = led_config.chain_count|default(1)|int %}
                {% set logo = namespace(indices=[]) %}
                {% set nozzle = namespace(indices=[]) %}
                {% for token in (tool.params_led_logo_idx|default('1')|string).split(',') %}
                    {% set raw_index = token|trim|string %}
                    {% if raw_index != raw_index|int|string %}
                        { action_raise_error('%s has invalid logo LED index %s.' % (name, token|trim)) }
                    {% endif %}
                    {% set index = raw_index|int %}
                    {% if index < 1 or index > chain_count %}
                        { action_raise_error('%s logo LED index %s is outside its neopixel chain.' % (name, token)) }
                    {% endif %}
                    {% set logo.indices = logo.indices + [index] %}
                {% endfor %}
                {% for token in (tool.params_led_nozzle_idx|default('2,3')|string).split(',') %}
                    {% set raw_index = token|trim|string %}
                    {% if raw_index != raw_index|int|string %}
                        { action_raise_error('%s has invalid nozzle LED index %s.' % (name, token|trim)) }
                    {% endif %}
                    {% set index = raw_index|int %}
                    {% if index < 1 or index > chain_count %}
                        { action_raise_error('%s nozzle LED index %s is outside its neopixel chain.' % (name, token)) }
                    {% endif %}
                    {% set nozzle.indices = nozzle.indices + [index] %}
                {% endfor %}
                {% if logo.indices|length != logo.indices|unique|list|length or nozzle.indices|length != nozzle.indices|unique|list|length %}
                    { action_raise_error('%s LED index lists must not contain duplicates.' % name) }
                {% endif %}
                {% for index in logo.indices %}
                    {% if index in nozzle.indices %}
                        { action_raise_error('%s logo and nozzle LED indices must not overlap.' % name) }
                    {% endif %}
                {% endfor %}
                {% set union = logo.indices + nozzle.indices %}
                {% for chain_name, owned_index in owned.pixels %}
                    {% if chain_name == tool.params_led_name and owned_index in union %}
                        { action_raise_error('%s shares LED pixel %d on neopixel %s with another tool.' % (name, owned_index, chain_name)) }
                    {% endif %}
                {% endfor %}
                {% for index in union %}
                    {% set owned.pixels = owned.pixels + [(tool.params_led_name, index)] %}
                {% endfor %}
                {% for effect in effects %}
                    {% set effect_name = prefix ~ '_' ~ effect %}
                    {% if 'led_effect ' ~ effect_name not in printer %}
                        { action_raise_error('%s is missing led_effect %s. Check its per-tool effect include.' % (name, effect_name)) }
                    {% elif effect.startswith('logo_') %}
                        _KLIPPAIN_VALIDATE_TOOL_LED_EFFECT EFFECT={effect_name} CHAIN={tool.params_led_name} INDEXES="{logo.indices|join(',')}"
                    {% elif effect.startswith('nozzle_') %}
                        _KLIPPAIN_VALIDATE_TOOL_LED_EFFECT EFFECT={effect_name} CHAIN={tool.params_led_name} INDEXES="{nozzle.indices|join(',')}"
                    {% else %}
                        _KLIPPAIN_VALIDATE_TOOL_LED_EFFECT EFFECT={effect_name} CHAIN={tool.params_led_name} INDEXES="{union|join(',')}"
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endfor %}
    {% endif %}

[gcode_macro _KLIPPAIN_VALIDATE_TOOL_LED_EFFECT]
gcode:
    {% set effect = params.EFFECT %}
    {% set chain = params.CHAIN %}
    {% set chain_count = printer.configfile.config['neopixel ' ~ chain].chain_count|default(1)|int %}
    {% set expected = namespace(indices=[]) %}
    {% for token in (params.INDEXES|string).split(',') %}
        {% set expected.indices = expected.indices + [token|int] %}
    {% endfor %}
    {% set actual = namespace(indices=[]) %}
    {% set cfg = printer.configfile.config['led_effect ' ~ effect] %}
    {% for raw_selector in cfg.leds.split('\n') %}
        {% set selector = raw_selector|trim %}
        {% if selector %}
            {% set open = selector.find('(') %}
            {% set selector_chain = (selector[:open]|trim) if open >= 0 else selector %}
            {% if selector_chain != 'neopixel:' ~ chain %}
                { action_raise_error('LED effect %s selects %s; expected only neopixel:%s.' % (effect, selector_chain, chain)) }
            {% elif open < 0 %}
                {% set actual.indices = actual.indices + (range(1, chain_count + 1)|list) %}
            {% else %}
                {% set selector_indices = selector[open + 1:].split(')')[0] %}
                {% for item in selector_indices.split(',') %}
                    {% if '-' in item %}
                        {% set limits = (item|trim).split('-') %}
                        {% set first_token = limits[0]|trim|string if limits|length > 0 else '' %}
                        {% set last_token = limits[1]|trim|string if limits|length > 1 else '' %}
                        {% if limits|length != 2 or first_token != first_token|int|string or last_token != last_token|int|string %}
                            { action_raise_error('LED effect %s has an invalid pixel range %s.' % (effect, item|trim)) }
                        {% endif %}
                        {% set first = first_token|int %}
                        {% set last = last_token|int %}
                        {% if first < 1 or last < 1 or ([first, last]|max) > chain_count %}
                            { action_raise_error('LED effect %s has an out-of-range pixel selector %s.' % (effect, item|trim)) }
                        {% endif %}
                        {% set actual.indices = actual.indices + (range([first, last]|min, ([first, last]|max) + 1)|list) %}
                    {% else %}
                        {% set raw_index = item|trim|string %}
                        {% if raw_index != raw_index|int|string %}
                            { action_raise_error('LED effect %s has an invalid pixel selector %s.' % (effect, item|trim)) }
                        {% endif %}
                        {% set index = raw_index|int %}
                        {% if index < 1 or index > chain_count %}
                            { action_raise_error('LED effect %s has an out-of-range pixel selector %s.' % (effect, item|trim)) }
                        {% endif %}
                        {% set actual.indices = actual.indices + [index] %}
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if actual.indices|length != expected.indices|length or actual.indices|sort != expected.indices|sort %}
        { action_raise_error('LED effect %s selects pixels %s; expected %s.' % (effect, actual.indices|sort|string, expected.indices|sort|string)) }
    {% endif %}

[gcode_macro _KLIPPAIN_TOOL_LED_GROUP]
gcode:
    {% set group = params.GROUP|default('')|lower %}
    {% set color = params.COLOR|default('')|lower %}
    {% set group_states = {'logo': ['standby', 'busy', 'heating', 'leveling', 'homing', 'cleaning', 'meshing', 'calibrating_z', 'printing', 'done_printing', 'error', 'on', 'off'], 'nozzle': ['standby', 'heating', 'done_printing', 'error', 'on', 'off']} %}
    {% if group not in group_states %}
        { action_raise_error('GROUP must be logo or nozzle.') }
    {% elif color not in group_states[group] %}
        { action_raise_error('COLOR=%s is not a supported %s LED effect state.' % (color, group)) }
    {% elif params.T is defined %}
        {% set raw_number = params.T|string %}
        {% if raw_number != raw_number|int|string %}
            { action_raise_error('T must be an integer tool number.') }
        {% else %}
            {% set number = raw_number|int %}
        {% endif %}
    {% elif printer.toolchanger.tool_number >= 0 %}
        {% set number = printer.toolchanger.tool_number %}
    {% else %}
        { action_raise_error('No tool is selected; specify T=n to control a tool LED group.') }
    {% endif %}
    {% if group in group_states and color in group_states[group] and number is defined %}
        {% if number not in printer.toolchanger.tool_numbers %}
            { action_raise_error('T%d is not a configured tool.' % number) }
        {% else %}
            {% set tool = printer[printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(number)]] %}
            {% if not tool.params_led_name|default('') %}
                { action_raise_error('T%d has no configured LED chain.' % number) }
            {% else %}
                {% set prefix = tool.params_led_effect_prefix|default('tc_t%d' % number) %}
                SET_LED_EFFECT EFFECT={prefix}_{group}_{color} REPLACE=1 FADETIME=0.5
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _KLIPPAIN_TOOL_SET_LEDS]
gcode:
    {% set group = params.GROUP|default('')|lower %}
    {% if group not in ['logo', 'nozzle'] %}
        { action_raise_error('GROUP must be logo or nozzle.') }
    {% elif params.T is defined %}
        {% set raw_number = params.T|string %}
        {% if raw_number != raw_number|int|string %}
            { action_raise_error('T must be an integer tool number.') }
        {% else %}
            {% set number = raw_number|int %}
        {% endif %}
    {% elif printer.toolchanger.tool_number >= 0 %}
        {% set number = printer.toolchanger.tool_number %}
    {% else %}
        { action_raise_error('No tool is selected; specify T=n to set raw tool LEDs.') }
    {% endif %}
    {% if group in ['logo', 'nozzle'] and number is defined %}
        {% if number not in printer.toolchanger.tool_numbers %}
            { action_raise_error('T%d is not a configured tool.' % number) }
        {% else %}
            {% set tool = printer[printer.toolchanger.tool_names[printer.toolchanger.tool_numbers.index(number)]] %}
            {% if not tool.params_led_name|default('') %}
                { action_raise_error('T%d has no configured LED chain.' % number) }
            {% else %}
                {% set indexes = tool.params_led_logo_idx|default('1') if group == 'logo' else tool.params_led_nozzle_idx|default('2,3') %}
                _SET_LEDS LED={tool.params_led_name} RED={params.RED|default(0)|float} GREEN={params.GREEN|default(0)|float} BLUE={params.BLUE|default(0)|float} WHITE={params.WHITE|default(0)|float} IDX="{indexes}" TRANSMIT={params.TRANSMIT|default(1)}
            {% endif %}
        {% endif %}
    {% endif %}

# Existing T commands are deliberately supplied before the backend registers its
# automatic commands. tool.register_t_gcode preserves user-defined macros.
[gcode_macro T0]
gcode:
    _KLIPPAIN_SELECT_TOOL T=0
[gcode_macro T1]
gcode:
    _KLIPPAIN_SELECT_TOOL T=1
[gcode_macro T2]
gcode:
    _KLIPPAIN_SELECT_TOOL T=2
[gcode_macro T3]
gcode:
    _KLIPPAIN_SELECT_TOOL T=3
[gcode_macro T4]
gcode:
    _KLIPPAIN_SELECT_TOOL T=4
[gcode_macro T5]
gcode:
    _KLIPPAIN_SELECT_TOOL T=5
[gcode_macro T6]
gcode:
    _KLIPPAIN_SELECT_TOOL T=6
